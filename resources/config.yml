project: &project !get_env_var GCLOUD_PROJECT_ID
models:
    endpoint: &endpoint !concat ['https://us-central1-aiplatform.googleapis.com/v1/projects/',*project,'/locations/us-central1/publishers/google/models/']
    llm: 
        name: &llm gemini-1.5-pro-001
        gateway_url: !concat [*endpoint,*llm,':generateContent']
    embedding:
        name: &embedding text-embedding-004
        gateway_url: !concat [*endpoint,*embedding,':predict']
knowledge:
    documents:
        graph: !read_json 'resources/knowledge/graph_v5.json'
    db:
        path: 'resources/db/vector/'
bigquery:
    explainability:
        table_id: &explainations wmt-mtech-assortment-ml-prod.dm_assortment_analytics_stg.expl_reason_categories
        description: !read_text 'resources/explainability/explainability.txt'
        schema: !get_or_read_schema
            csv: 'resources/explainability/explainability_limited.csv'
            table: *explainations
        primary_key: [Relay_Scenario_Name, jobId, planogram_or_store, rollup_id]