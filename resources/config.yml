platform: vertexai
vertexai:
    project_id: &project wmt-mtech-assortment-ml-prod
element:
    bigquery:
        connector: gcp-mtech-dev
llm:
    name: &model gemini-1.5-pro-001
    gateway_url: !concat ['https://us-central1-aiplatform.googleapis.com/v1/projects/',*project,'/locations/us-central1/publishers/google/models/',*model,':generateContent']
    generation_config:
        maxOutputTokens: 2048
        temperature: 0
        topP: 1
bigquery:
    mapping: wmt-mtech-assortment-ml-dev.clearance_markdown_ml_dev.plan_dept_sbu_mapping
    tables:
        apparel:
            table_id: wmt-mtech-assortment-ml-prod.clearance_md_report.apparel_cmd_wkly_kpi_table_rpt
            description: !read_text 'resources/apparel_weekly_report.txt'
            schema: 
        food: &fcgm
            table_id: wmt-mtech-assortment-ml-prod.clearance_md_report.fcgm_cmd_wkly_kpi_table_rpt
            description: !read_text 'resources/fcgm_weekly_report.txt'
            schema: 
        cons: *fcgm
        hardlines: *fcgm
        home: *fcgm
        ets: *fcgm
